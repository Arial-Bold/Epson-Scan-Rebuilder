name: Build

# Every push builds the builder on an Apple Silicon Mac and keeps the zip as a download on the run.
# A tag like v1.0 also publishes it on the Releases page.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-builder:
    runs-on: macos-latest      # GitHub's current Apple Silicon Mac
    steps:
      - uses: actions/checkout@v5
      # Apple's own Python (from the Command Line Tools), the one the builder uses on people's Macs
      - name: Engine scripts compile with Apple's Python
        run: |
          PY="$(xcode-select -p)/usr/bin/python3"
          "$PY" --version
          "$PY" -m compileall -q engine
      - name: Engine refuses a file that isn't Epson's installer
        run: |
          echo "not a disk image" > not-epson.pkg
          "$(xcode-select -p)/usr/bin/python3" engine/build.py check not-epson.pkg | tee out.txt
          grep -q "^CHECK wrong" out.txt
      - name: Build "Scanner App Builder.app"
        run: sh build_builder.sh
      - name: Keep the zip
        uses: actions/upload-artifact@v5
        with:
          name: Scanner-App-Builder
          path: build/Scanner App Builder.zip
      - name: Publish on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Scanner App Builder.zip
          generate_release_notes: true
